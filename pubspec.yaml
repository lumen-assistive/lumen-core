dependencies:
  lumen_sdk:
    git:
      url: https://github.com/lumen-assistive/lumen-sdk.git
      ref: v0.1.0
  meta: ^1.15.0
  pub_semver: ^2.1.4

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
