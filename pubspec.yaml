  Lumen senses engine: the event bus, model registry and plugin manager
  implementation shared by every Lumen module.
version: 0.1.0
publish_to: none
repository: https://github.com/lumen-assistive/lumen-core
issue_tracker: https://github.com/lumen-assistive/lumen-core/issues
homepage: https://github.com/lumen-assistive/lumen-core

environment:
